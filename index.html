<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helix Impulse</title>
  <meta name="description" content="Helix Impulse – bald online.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%236d5efc'/></svg>">
  <style>
    :root {
      --bg: #0b0d17;
      --fg: #eef0ff;
      --muted: #9aa0c3;
      --accent: #6d5efc;
      --accent2: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      background: radial-gradient(ellipse at 20% 0%, #1b1640 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    header, main, footer { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 24px; }
    header { display: flex; align-items: center; gap: 10px; padding-top: 28px; font-weight: 600; letter-spacing: .02em; }
    .logo { width: 28px; height: 28px; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 64px; padding-bottom: 64px; }
    .tag { color: var(--accent2); font-size: .85rem; text-transform: uppercase; letter-spacing: .15em; margin-bottom: 16px; }
    h1 { font-size: clamp(2.4rem, 7vw, 4.5rem); line-height: 1.05; margin-bottom: 20px; }
    h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p.lead { color: var(--muted); font-size: 1.15rem; max-width: 560px; margin-bottom: 32px; }
    .btn { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
    .btn:hover { filter: brightness(1.1); }
    footer { padding-bottom: 28px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      <path d="M10 4c8 4 4 8 12 12S14 24 22 28" stroke="url(#g)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M22 4c-8 4-4 8-12 12s8 8 0 12" stroke="url(#g)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
    </svg>
    Helix Impulse
  </header>
  <main>
    <div class="tag">Bald verfügbar</div>
    <h1>Neue Impulse.<br><span>Helix Impulse.</span></h1>
    <p class="lead">Hier entsteht etwas Neues. Schau bald wieder vorbei – oder schreib uns, wenn du vorab informiert werden möchtest.</p>
    <div><a class="btn" href="mailto:johanklee8@gmail.com">Kontakt aufnehmen</a></div>
  </main>
  <footer>© <span id="y"></span> Helix Impulse</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
