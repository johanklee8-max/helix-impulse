<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found – Helix Impulse</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#071018">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/legal.css">
  <style>
    .notfound { min-height: calc(100vh - 160px); display: grid; place-content: center; text-align: center; padding: 48px 16px; }
    .notfound img { height: 96px; width: auto; margin: 0 auto 28px; opacity: .9; }
    .notfound .code { color: var(--accent); font-weight: 600; letter-spacing: .12em; font-size: 14px; margin: 0 0 10px; }
    .notfound h1 { margin: 0 0 14px; }
    .notfound p { color: var(--muted); max-width: 460px; margin: 0 auto 32px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .actions a { display: inline-flex; align-items: center; min-height: 46px; padding: 10px 22px; border-radius: 12px; font-weight: 600; text-decoration: none; }
    .actions .primary { background: linear-gradient(180deg, #6fd6ff, var(--accent)); color: #041018; }
    .actions .ghost { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .actions .ghost:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  </style>
</head>
<body>
  <main class="notfound">
    <img src="/assets/logo-mark.png" alt="" width="38" height="96">
    <p class="code">404</p>
    <h1><span data-lang="en">Page not found</span><span data-lang="de" hidden>Seite nicht gefunden</span></h1>
    <p><span data-lang="en">The page you are looking for does not exist or has moved.</span><span data-lang="de" hidden>Die gesuchte Seite gibt es nicht oder sie ist umgezogen.</span></p>
    <div class="actions">
      <a class="primary" href="/" data-home><span data-lang="en">Go to the home page</span><span data-lang="de" hidden>Zur Startseite</span></a>
      <a class="ghost" href="/tutorials.html">Tutorials</a>
    </div>
  </main>
  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('helix-locale'); } catch (e) {}
      if (!lang) lang = /^de\b/i.test(navigator.language || '') || location.pathname.indexOf('/de/') === 0 ? 'de' : 'en';
      if (lang !== 'de') return;
      document.documentElement.lang = 'de';
      document.title = 'Seite nicht gefunden – Helix Impulse';
      document.querySelectorAll('[data-lang]').forEach(function (el) { el.hidden = el.getAttribute('data-lang') !== 'de'; });
      document.querySelector('[data-home]').setAttribute('href', '/de/');
    })();
  </script>
</body>
</html>
